name: Bem-vindo

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write

env:
  STEP_0_FILE: ".github/steps/0-welcome.md"
  STEP_1_FILE: ".github/steps/1-first-workflow.md"

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Start Exercise
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.8.1
    with:
      exercise-title: "GitHub Actions do zero ao CI/CD com o OctoMatch"
      intro-message: "Bem-vindo ao treinamento de GitHub Actions! Você vai automatizar o OctoMatch, um jogo da memória em React + Vite, aprendendo workflows, jobs, testes em CI, artifacts, reusable workflows e GitHub Models. Acompanhe cada passo por esta issue. Ao concluir o trabalho esperado e fazer push, a automação valida seu progresso e publica o próximo passo aqui."

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.8.1

      - name: Create comment - setup
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_0_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_1_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Deixar apenas o Passo 1 habilitado
        run: |
          gh workflow disable "2-ci-tests.yml" || true
          gh workflow disable "3-artifacts.yml" || true
          gh workflow disable "4-reusable.yml" || true
          gh workflow disable "5-ai-actions.yml" || true
          gh workflow enable "1-first-workflow.yml"
          gh workflow disable "0-welcome.yml" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
